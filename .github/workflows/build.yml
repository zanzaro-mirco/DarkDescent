# Build Windows su tag di milestone (m*) o di versione (v*) e su avvio manuale (D3).
# Prima girano i test: un tag con un test rosso non produce build.
# Da avvio manuale si può scegliere la build Web (M3, passo 3.7); i tag fanno sempre Windows.
name: Build

on:
  push:
    tags: ['m*', 'v*']
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: Piattaforma
        type: choice
        options: [StandaloneWindows64, WebGL]
        default: StandaloneWindows64
      development:
        description: Build di sviluppo, per il Profiler (M11, passo 11.6)
        type: boolean
        default: false

# Niente concurrency a livello di workflow: il gruppo "unity" lo prende già tests.yml
# richiamato qui sotto, e lo stesso gruppo su chiamante e chiamato si blocca a vicenda.
# La build lo prende a livello di job, dopo che i test l'hanno rilasciato.

permissions:
  contents: read
  checks: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  build:
    name: Build ${{ inputs.targetPlatform || 'StandaloneWindows64' }}
    needs: tests
    # Fissato come le action (D1).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: unity
      cancel-in-progress: false
    # Sui tag inputs è vuoto: Windows.
    env:
      TARGET_PLATFORM: ${{ inputs.targetPlatform || 'StandaloneWindows64' }}
      ARTIFACT_LABEL: ${{ inputs.targetPlatform == 'WebGL' && 'Web' || 'Windows' }}${{ inputs.development && '-dev' || '' }}
    steps:
      # Stesso checkout e stessa cache LFS dei test: vedi tests.yml.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Lista degli oggetti LFS
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS
        run: git lfs pull

      # Cache separata da quella dei test, una per piattaforma: la Library contiene gli asset
      # importati per la piattaforma della build. Se manca, riparte da quella dei test, che ha
      # già gli script compilati e gli asset comuni.
      - name: Cache Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ env.TARGET_PLATFORM }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ env.TARGET_PLATFORM }}-
            Library-

      # La versione (D7 della M11): sui tag di versione è il tag senza la v (v1.0.0 → 1.0.0), passata
      # come Custom. Non versioning: Tag, che legge `git tag --points-at HEAD` per intero: con due tag
      # sullo stesso commit (m11 e v1.0.0) la versione sarebbe tutti e due, e senza tag sarebbe vuota.
      # Sui tag di milestone e da avvio manuale resta il bundleVersion del progetto. Se il tag non
      # coincide con il bundleVersion la build esce lo stesso, con un avviso: va allineato il progetto.
      - name: Versione
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            project=$(sed -n 's/^  bundleVersion: //p' ProjectSettings/ProjectSettings.asset)
            if [ "$version" != "$project" ]; then
              echo "::warning::Il tag $GITHUB_REF_NAME non coincide con il bundleVersion del progetto ($project)"
            fi
            echo "strategy=Custom" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "strategy=None" >> "$GITHUB_OUTPUT"
          fi

      # Windows con backend Mono: l'immagine windows-mono gira su runner Linux. Per il Web
      # GameCI sceglie da sé l'immagine webgl. Compressione Gzip con decompression fallback,
      # nelle impostazioni del progetto: la pagina parte anche da un server che non manda
      # gli header Content-Encoding, come un server locale o itch.io.
      # -Development: lo script di build di GameCI accende le BuildOptions con lo stesso nome
      # passate come parametri. La build di sviluppo si collega al Profiler dell'editor sulla
      # stessa rete e ha i contatori delle allocazioni; sui tag inputs è vuoto e la build è normale.
      - name: Build
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.71
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          buildName: DarkDescent
          versioning: ${{ steps.version.outputs.strategy }}
          version: ${{ steps.version.outputs.version }}
          customParameters: ${{ inputs.development && '-Development' || '' }}

      - name: Artifact
        uses: actions/upload-artifact@v7
        with:
          name: DarkDescent-${{ env.ARTIFACT_LABEL }}-${{ github.ref_name }}
          path: build/${{ env.TARGET_PLATFORM }}
          retention-days: 30
          if-no-files-found: error
